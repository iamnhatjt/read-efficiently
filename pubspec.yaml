name: vibe_read
description: "VibeRead — Desktop Speed Reading App with Native PDF Support"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # PDF rendering & text extraction
  pdfrx: ^2.0.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.0

  # File handling
  file_picker: ^8.1.2
  desktop_drop: ^0.5.0

  # Text-to-speech
  flutter_tts: ^4.0.2

  # Typography
  google_fonts: ^6.2.1

  # Networking & HTML parsing
  http: ^1.2.2
  html: ^0.15.4

  # Desktop window control
  window_manager: ^0.4.2

  # Hashing
  crypto: ^3.0.3

  # URL launcher
  url_launcher: ^6.2.5

  # Path provider
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
